host: localhost:8080
info:
  contact:
    email: support@luxe.com
    name: API Support
  description: Production-grade e-commerce backend
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Shopping Platform API
  version: "1.0"
paths:
  /account/orders:
    get:
      consumes:
      - application/json
      description: Returns paginated list of user orders including items with product
        details
      parameters:
      - description: Items per page (default 10, max 50)
        in: query
        name: limit
        type: integer
      - description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.OrderListResponseData'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Get user order history
      tags:
      - Account
  /account/push/subscriptions:
    delete:
      consumes:
      - application/json
      description: Removes a Web Push subscription by endpoint for the current user
      parameters:
      - description: Push subscription endpoint
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.DeletePushSubscriptionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Delete push subscription
      tags:
      - Push
    post:
      consumes:
      - application/json
      description: Stores a Web Push subscription endpoint and keys for the current
        user
      parameters:
      - description: Push subscription
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterPushSubscriptionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Register push subscription
      tags:
      - Push
  /account/push/test:
    post:
      description: Sends a test push notification to all registered devices for the
        current user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Send test push notification
      tags:
      - Push
  /account/summary:
    get:
      consumes:
      - application/json
      description: Returns user profile, default addresses, address count, liked products
        count, and recent orders (max 3)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.DashboardSummaryResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Get user dashboard summary
      tags:
      - Account
  /account/wishlist:
    get:
      consumes:
      - application/json
      description: Returns products the user has liked, with product details (image,
        price, name)
      parameters:
      - description: Items per page (default 10, max 50)
        in: query
        name: limit
        type: integer
      - description: Pagination offset
        in: query
        name: offset
        type: integer
      - description: Sort order (name, price-asc, price-desc)
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.WishlistResponseData'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Get user's wishlist
      tags:
      - Account
      - Wishlist
  /addresses:
    get:
      consumes:
      - application/json
      description: Returns all saved addresses for the current user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  properties:
                    addresses:
                      items:
                        $ref: '#/definitions/models.Address'
                      type: array
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: List user addresses
      tags:
      - Addresses
    post:
      consumes:
      - application/json
      description: Adds a new shipping, billing, or both type address for the current
        user.
