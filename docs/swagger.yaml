host: localhost:8080
info:
  contact:
    email: support@luxe.com
    name: API Support
  description: Production-grade e-commerce backend
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Shopping Platform API
  version: "1.0"
paths:
  /account/orders:
    get:
      consumes:
      - application/json
      description: Returns paginated list of user orders including items with product
        details
      parameters:
      - description: Items per page (default 10, max 50)
        in: query
        name: limit
        type: integer
      - description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.OrderListResponseData'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Get user order history
      tags:
      - Account
  /account/push/subscriptions:
    delete:
      consumes:
      - application/json
      description: Removes a Web Push subscription by endpoint for the current user
      parameters:
      - description: Push subscription endpoint
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.DeletePushSubscriptionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Delete push subscription
      tags:
      - Push
    post:
      consumes:
      - application/json
      description: Stores a Web Push subscription endpoint and keys for the current
        user
      parameters:
      - description: Push subscription
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterPushSubscriptionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Register push subscription
      tags:
      - Push
  /account/push/test:
    post:
      description: Sends a test push notification to all registered devices for the
        current user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Send test push notification
      tags:
      - Push
  /account/summary:
    get:
      consumes:
      - application/json
      description: Returns user profile, default addresses, address count, liked products
        count, and recent orders (max 3)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.DashboardSummaryResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Get user dashboard summary
      tags:
      - Account
  /account/wishlist:
    get:
      consumes:
      - application/json
      description: Returns products the user has liked, with product details (image,
        price, name)
      parameters:
      - description: Items per page (default 10, max 50)
        in: query
        name: limit
        type: integer
      - description: Pagination offset
        in: query
        name: offset
        type: integer
      - description: Sort order (name, price-asc, price-desc)
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.WishlistResponseData'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Get user's wishlist
      tags:
      - Account
      - Wishlist
  /addresses:
    get:
      consumes:
      - application/json
      description: Returns all saved addresses for the current user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  properties:
                    addresses:
                      items:
                        $ref: '#/definitions/models.Address'
                      type: array
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: List user addresses
      tags:
      - Addresses
    post:
      consumes:
      - application/json
      description: Adds a new shipping, billing, or both type address for the current
        user.
      parameters:
      - description: Address data including address_type (shipping, billing, both)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAddressRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.AddressSingleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Create address
      tags:
      - Addresses
  /addresses/{id}:
    delete:
      consumes:
      - application/json
      description: Soft deletes an address by ID. Only owner can delete.
      parameters:
      - description: Address ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.EmptyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Delete address
      tags:
      - Addresses
    put:
      consumes:
      - application/json
      description: Updates an address by its ID. Only owner can update. Supports partial
        updates.
      parameters:
      - description: Address ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to update (optional) including address_type (shipping,
          billing, both)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateAddressRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AddressSingleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Update address
      tags:
      - Addresses
  /addresses/{id}/default:
    patch:
      consumes:
      - application/json
      description: Marks a specific address as the default (for its address_type,
        e.g., shipping or billing). Only one default per type.
      parameters:
      - description: Address ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.EmptyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Set default address
      tags:
      - Addresses
  /addresses/default:
    get:
      consumes:
      - application/json
      description: Returns the default shipping or billing address for the current
        user.
      parameters:
      - default: shipping
        description: Address type (shipping/billing)
        enum:
        - shipping
        - billing
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AddressSingleResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Get default address
      tags:
      - Addresses
  /admin/ai/generate:
    post:
      consumes:
      - application/json
      description: Generates product description, SEO metadata, or coupon copy for
        staff
      parameters:
      - description: Generate request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.AiGenerateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.AiGenerateResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/utils.Response'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Generate AI copy
      tags:
      - Admin AI
  /admin/ai/status:
    get:
      description: Returns AI provider configuration for admin UI
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.AiStatusResponse'
              type: object
      security:
      - BearerAuth: []
      summary: AI status
      tags:
      - Admin AI
  /admin/audit-logs:
    get:
      parameters:
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      - description: Search path, resource, email
        in: query
        name: search
        type: string
      - description: HTTP action
        in: query
        name: action
        type: string
      - description: Resource path filter
        in: query
        name: resource
        type: string
      - description: Actor user id
        in: query
        name: user_id
        type: integer
      - description: From date (YYYY-MM-DD or RFC3339)
        in: query
        name: date_from
        type: string
      - description: To date (YYYY-MM-DD or RFC3339)
        in: query
        name: date_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: List audit logs
      tags:
      - Admin Audit
  /admin/audit-logs/summary:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuditLogSummaryResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Audit log summary
      tags:
      - Admin Audit
  /admin/campaigns:
    get:
      parameters:
      - description: Items per page
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Search name or slug
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CampaignListResponse'
      security:
      - BearerAuth: []
      summary: List campaigns
      tags:
      - Promotions
    post:
      consumes:
      - application/json
